<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Popup</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <div class="snp-title">
          <h1>Sniffies Plug-ins</h1>
          <span id="snp-version" class="snp-version"></span>
        </div>
        <button
          id="open-settings"
          class="primary"
          type="button"
          title="Settings"
          aria-label="Open settings"
        >
          ⚙
        </button>
      </header>

      <div id="snp-geo-root"></div>

      <div id="snp-profile-border-root"></div>

      <details id="favorites-details" class="section collapsible">
        <summary><h2>Favorites</h2></summary>
        <div class="collapsible-body">
          <p id="favorites-hint" class="hint"></p>
          <label class="row">
            <input id="favorites-enabled" type="checkbox" />
            <span id="favorites-enable-label">Enable</span>
          </label>
        </div>
      </details>

      <details id="bot-blocking-details" class="section collapsible">
        <summary><h2>Block Bot Accounts</h2></summary>
        <div class="collapsible-body">
          <p id="bot-blocking-hint" class="hint"></p>
          <label class="row">
            <input id="bot-blocking-enabled" type="checkbox" />
            <span id="bot-blocking-enable-label">Enable</span>
          </label>
        </div>
      </details>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
