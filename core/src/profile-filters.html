<details class="section collapsible" id="profile-filters-details">
  <summary class="snp-row">
    <label class="snp-switch">
      <input id="profile-filters-enabled" type="checkbox" aria-label="{{profileFilters.label}}" />
      <span class="snp-switch-slider"></span>
    </label>
    <p class="snp-label">{{profileFilters.label}}</p>
  </summary>
  <div class="collapsible-body">
    <p class="hint" id="profile-filters-hint">{{profileFilters.hint}}</p>
  </div>
</details>
