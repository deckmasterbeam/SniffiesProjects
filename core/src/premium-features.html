<details class="section collapsible" id="premium-details">
  <summary class="snp-row">
    <label class="snp-switch">
      <input id="premium-enabled" type="checkbox" aria-label="{{premium.label}}" />
      <span class="snp-switch-slider"></span>
    </label>
    <p class="snp-label">{{premium.label}}</p>
  </summary>
  <div class="collapsible-body">
    <p id="premium-plus-notice" class="hint notice" style="display: none">
      {{premium.plusNotice}}
    </p>
    <p class="hint">
      {{premium.hint}}
    </p>
    <div id="premium-config" class="premium-section">
      <div id="premium-geo" class="premium-feature">
        <div class="premium-feature-head snp-row">
          <label class="snp-switch">
            <input id="premium-flag-location" type="checkbox" aria-label="{{premium.location.label}}" />
            <span class="snp-switch-slider"></span>
          </label>
          <button class="premium-feature-toggle" type="button" aria-expanded="false">
            <span class="snp-label">{{premium.location.label}}</span>
          </button>
        </div>
        <div class="premium-feature-body premium-section" hidden>
          <p class="hint">
            {{premium.location.hint}}
          </p>
          <div class="actions">
            <button id="geo-clear" class="secondary" type="button">{{premium.location.clear}}</button>
            <span id="geo-saved" class="hint" aria-live="polite"></span>
          </div>
        </div>
      </div>
      <div id="premium-border" class="premium-feature">
        <div class="premium-feature-head snp-row">
          <label class="snp-switch">
            <input
              id="premium-flag-boundary"
              type="checkbox"
              aria-label="{{premium.boundary.label}}"
            />
            <span class="snp-switch-slider"></span>
          </label>
          <button class="premium-feature-toggle" type="button" aria-expanded="false">
            <span class="snp-label">{{premium.boundary.label}}</span>
          </button>
        </div>
        <div class="premium-feature-body premium-section" hidden>
          <p id="profile-border-hint" class="hint">
            {{premium.boundary.hint}}
          </p>
          <label id="profile-border-tab-field" class="field">
            <span>{{premium.boundary.openIn}}</span>
            <select id="profile-border-tab">
              <option value="current-tab">{{premium.boundary.currentTab}}</option>
              <option value="new-tab">{{premium.boundary.newTab}}</option>
            </select>
          </label>
          <div class="actions">
            <button id="profile-border-save" class="primary" type="button" style="display: none">
              {{premium.boundary.save}}
            </button>
          </div>
        </div>
      </div>
      <div id="premium-photos" class="premium-feature">
        <div class="premium-feature-head snp-row">
          <label class="snp-switch">
            <input id="premium-flag-photos" type="checkbox" aria-label="{{premium.photos.label}}" />
            <span class="snp-switch-slider"></span>
          </label>
          <button class="premium-feature-toggle" type="button" aria-expanded="false">
            <span class="snp-label">{{premium.photos.label}}</span>
          </button>
        </div>
        <div class="premium-feature-body premium-section" hidden>
          <p class="hint">
            {{premium.photos.hint}}
          </p>
        </div>
      </div>
    </div>
  </div>
</details>
