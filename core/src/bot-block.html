<details class="section collapsible" id="bot-block-details">
  <summary class="snp-row">
    <label class="snp-switch">
      <input id="bot-block-enabled" type="checkbox" aria-label="{{botBlock.label}}" />
      <span class="snp-switch-slider"></span>
    </label>
    <p class="snp-label">{{botBlock.label}}</p>
  </summary>
  <div class="collapsible-body">
    <p id="bot-block-count" class="stat"></p>
    <p id="bot-block-hint" class="hint"></p>
  </div>
</details>
