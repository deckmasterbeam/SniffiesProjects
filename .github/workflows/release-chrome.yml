name: Release Chrome Extension

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: yarn install
        working-directory: client

      - name: Build extension
        run: yarn build:prod
        working-directory: client
        env:
          SERVER_BASE: ${{ secrets.SERVER_BASE }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          FAVORITES_NOTIFICATIONS_ENABLED: ${{ vars.FAVORITES_NOTIFICATIONS_ENABLED }}
          REPORTING_ENABLED: ${{ vars.REPORTING_ENABLED }}

      - name: Zip dist
        run: cd dist && zip -r ../sniffies-chrome.zip . && cd ..
        working-directory: client

      - name: Publish release
        run: |
          VERSION=$(node -p "require('./client/package.json').version")
          TAG="chrome-$VERSION"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --title "Chrome Extension v$VERSION" \
            --notes "Automated build from [\`${GITHUB_SHA::7}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})" \
            client/sniffies-chrome.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
