<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sniffies mock</title>
  </head>
  <body>
    <!-- FAB mount anchor for the bookmarklet — see SITELINKS_NAV_SELECTOR. -->
    <nav>
      <a title="Sitelinks" href="#">Sitelinks</a>
    </nav>

    <div id="map">
      <!-- Within the free radius: a normal click should open the profile
           panel and get the star/report injection. -->
      <div
        data-testid="markerUserContainer"
        data-within-radius="true"
        id="aaaaaaaaaaaaaaaaaaaaaaaa"
      >
        <div
          data-testid="cv-marker-avatar-image"
          style="
            background-image: url(&quot;https://cdn.sniffies.test/aaaaaaaaaaaaaaaaaaaaaaaa/photo.jpg&quot;);
            width: 40px;
            height: 40px;
          "
        ></div>
      </div>
      <!-- Outside the free radius: profile-border-hook should redirect
           straight to /profile/<id> instead of opening a panel. -->
      <div
        data-testid="markerUserContainer"
        data-within-radius="false"
        id="bbbbbbbbbbbbbbbbbbbbbbbb"
      >
        <div
          data-testid="cv-marker-avatar-image"
          style="
            background-image: url(&quot;https://cdn.sniffies.test/bbbbbbbbbbbbbbbbbbbbbbbb/photo.jpg&quot;);
            width: 40px;
            height: 40px;
          "
        ></div>
      </div>
    </div>

    <div id="app-screen"></div>

    <script>
      document.querySelectorAll('[data-testid="markerUserContainer"]').forEach((marker) => {
        marker.addEventListener("click", () => {
          if (marker.dataset.withinRadius === "false") {
            return;
          }
          const id = marker.id;
          setTimeout(() => {
            document.getElementById("app-screen").innerHTML = `
              <span data-testid="cruiserNameLabel">Mock User ${id}</span>
              <button data-testid="pinUserButton" type="button">Pin</button>
              <button data-testid="threedotButton" type="button"><i class="fa fa-ellipsis-h"></i></button>
            `;
            // Like real Sniffies, the options menu only exists once opened.
            document.querySelector('[data-testid="threedotButton"]').addEventListener("click", () => {
              const menu = document.createElement("div");
              menu.className = "tooltip-container";
              menu.innerHTML = `
                <div data-testid="profileOptionsContainer" class="tooltip-content">
                  <button data-testid="reportCruiserButton"><span><i class="fa fa-exclamation-triangle"></i>Report Cruiser </span></button>
                  <button data-testid="blockUserButton"><span><i class="fa fa-ban"></i>Block Cruiser</span></button>
                  <button data-testid="copyPageLink"><span><i class="fa fa-link"></i>Copy link</span></button>
                </div>
              `;
              document.getElementById("app-screen").appendChild(menu);
            });
          }, 200);
        });
      });
    </script>
  </body>
</html>
